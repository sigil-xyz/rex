# Rex Configuration
# Copy this file to ~/.config/rex/config.toml and edit as needed.

[daemon]
# Path to the unix socket
socket_path = ""  # default: $XDG_RUNTIME_DIR/rex.sock
# Logging level: debug, info, warning, error
log_level = "info"

[audio]
# Input device name or index. Leave empty for system default.
# List devices: python -c "import sounddevice; print(sounddevice.query_devices())"
device = ""
# Sample rate in Hz (Whisper expects 16000)
sample_rate = 16000
# Minimum recording duration in seconds — prevents accidental triggers
min_duration = 0.5

[stt]
# Whisper model: tiny.en, base.en, small.en
# Larger = more accurate, more RAM, slower
model = "tiny.en"
# Device: cpu or cuda
device = "cpu"

[tts]
# Path to piper binary
piper_bin = "/usr/bin/piper"
# Path to piper voice model (.onnx file)
model = "/usr/share/piper/voices/en_US-lessac-medium.onnx"
# Output audio device. Leave empty for system default.
device = ""

[notification]
# Show desktop notification with response text
enabled = true
# Notification timeout in milliseconds
timeout = 5000
