name: Feature Request
description: Propose a new capability
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Features should be discussed in [Discussions](../../discussions) before opening an issue.
        Only open a feature issue if a maintainer has already confirmed the idea in a Discussion.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe what you cannot do today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you consider?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Voice / STT
        - TTS output
        - Response engine / LLM
        - System monitoring
        - Project scaffolding
        - Configuration
        - Hotkey / trigger
        - CI / tooling
        - Documentation
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions — this is not a duplicate
          required: true
        - label: A maintainer confirmed this in a Discussion
          required: false
