name: Bug Report
description: Something is broken
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before submitting. If you found one, add a reaction instead of a duplicate.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press SUPER+Space
        2. Say "hello"
        3. See error / no response
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `journalctl --user -u rex -n 50`
      render: shell

  - type: input
    id: version
    attributes:
      label: Rex version
      placeholder: "0.0.1"
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: System
      placeholder: "Arch Linux, Hyprland 0.40.0, Python 3.12"
    validations:
      required: true
